<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Mean trigger lead time, seed 1337</title><desc id="desc">Real connectivity had a mean trigger lead of 0.202 seconds and shuffled connectivity had 0.183 seconds across 200 paired trials.</desc>
  <rect width="900" height="560" fill="#f7f9fc"/><text x="60" y="58" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17243a">Mean trigger lead — seed 1337</text><text x="60" y="90" font-family="Arial,sans-serif" font-size="17" fill="#52627a">200 paired trials · seconds from GF trigger to committed-lunge impact</text>
  <line x1="160" y1="440" x2="810" y2="440" stroke="#52627a" stroke-width="2"/><line x1="160" y1="150" x2="160" y2="440" stroke="#52627a" stroke-width="2"/>
  <g font-family="Arial,sans-serif" font-size="14" fill="#52627a"><text x="145" y="445" text-anchor="end">0.000 s</text><text x="145" y="300" text-anchor="end">0.100 s</text><text x="145" y="155" text-anchor="end">0.200 s</text><text x="160" y="470" text-anchor="middle">0.000</text><text x="485" y="470" text-anchor="middle">0.100</text><text x="810" y="470" text-anchor="middle">0.200 s</text></g>
  <rect x="160" y="147" width="525" height="70" rx="10" fill="#7450a8"/><rect x="160" y="174.55" width="476" height="70" rx="10" fill="#b26b2e"/>
  <text x="700" y="192" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#7450a8">Real connectivity: 0.202 s</text><text x="650" y="242" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#b26b2e">Shuffled: 0.183 s</text>
  <text x="450" y="525" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#52627a">Lead time is not survival duration, jump count, or egg production.</text>
</svg>